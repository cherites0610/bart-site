<!doctype html><html lang="zh-Hant"><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Noto+Sans+TC:wght@400&family=Noto+Serif+TC:wght@700&display=swap">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#14213a;color:#ece6d6;position:relative;overflow:hidden;font-family:'Noto Sans TC',sans-serif}
h1{position:absolute;left:96px;top:120px;margin:0;font:700 150px/1.05 'Noto Serif TC',serif;letter-spacing:-.02em}
.latin{position:absolute;left:100px;top:300px;font:500 44px 'JetBrains Mono',monospace;color:#aab4c8}
p{position:absolute;left:100px;top:400px;margin:0;font-size:36px;line-height:1.7;width:640px}
.stamp{--p:9px;--pitch:21px;position:absolute;right:110px;top:70px;width:340px;height:430px;padding:14px;box-sizing:border-box;
background:
radial-gradient(circle at 50% 0,#14213a 0 var(--p),transparent calc(var(--p) + .5px)) 0 0/var(--pitch) calc(var(--p) + 1px) repeat-x,
radial-gradient(circle at 50% 100%,#14213a 0 var(--p),transparent calc(var(--p) + .5px)) 0 100%/var(--pitch) calc(var(--p) + 1px) repeat-x,
radial-gradient(circle at 0 50%,#14213a 0 var(--p),transparent calc(var(--p) + .5px)) 0 0/calc(var(--p) + 1px) var(--pitch) repeat-y,
radial-gradient(circle at 100% 50%,#14213a 0 var(--p),transparent calc(var(--p) + .5px)) 100% 0/calc(var(--p) + 1px) var(--pitch) repeat-y,#f4efe3;
filter:drop-shadow(0 14px 18px rgba(4,8,20,.5))}
.stamp div{height:100%;border:2px solid #1f5f4a;box-sizing:border-box}
svg{position:absolute;right:60px;top:40px;width:200px;rotate:-14deg;color:#d8402f}
</style>
<h1>廖柏安</h1><div class="latin">Bart</div>
<p>我是全端開發者，從人的需求出發，<br>把事情做成系統。</p>
<div class="stamp"><div></div></div>
